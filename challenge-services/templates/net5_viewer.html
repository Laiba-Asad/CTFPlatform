<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture Viewer</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; color: #1b2430; background: #eef1f5; }
  header { background: #1b2430; color: #fff; padding: 10px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  .wrap { padding: 12px 16px; }
  input[type=text] { width: 320px; max-width: 100%; padding: 6px 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #e2e8f0; }
  th { background: #f6f8fb; position: sticky; top: 0; }
  tr.packet { cursor: pointer; }
  tr.packet:hover { background: #f0f6ff; }
  tr.packet.selected { background: #dbeafe; }
  .mono { font-family: "Courier New", monospace; }
  #detail { margin-top: 12px; background: #fff; border: 1px solid #d6dee8; border-radius: 6px; padding: 10px 12px; display: none; }
  #detail pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; }
  button { padding: 4px 10px; }
  .muted { color: #64748b; }
</style>
</head>
<body>
<header><h1>Capture Viewer</h1><div class="muted">intranet.local - 40 packets captured</div></header>
<div class="wrap">
  <p>
    <label>Filter <input id="filter" type="text" placeholder="e.g. http, DNS, 10.14.0.9, login"></label>
    <span id="count" class="muted"></span>
  </p>
  <div style="max-height: 46vh; overflow:auto; border:1px solid #d6dee8; border-radius:6px;">
    <table>
      <thead><tr><th>No.</th><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Info</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="detail">
    <div>
      <strong>Packet <span id="d-no"></span></strong>
      <button id="follow" type="button">Follow stream</button>
      <span id="d-stream" class="muted"></span>
    </div>
    <pre id="d-payload" class="mono"></pre>
  </div>
</div>
<script src="/assets/viewer.js"></script>
</body>
</html>
