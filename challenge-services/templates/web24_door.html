<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Check</title>
<style>
  body { font-family: Tahoma, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 16px; color: #222; background: #f2f4ef; }
  .card { background: #fff; border: 1px solid #d3d9cd; border-radius: 8px; padding: 16px 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>Badge Check</h1>
{% if staff %}
  <p>Welcome, staff member. Today's staff code: {{ flag }}</p>
{% else %}
  <p>Welcome, visitor. The staff lounge is for staff badges only.</p>
{% endif %}
</div>
</body>
</html>
