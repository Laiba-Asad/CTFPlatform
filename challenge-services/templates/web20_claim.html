<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prize Desk</title>
<style>
  body { font-family: Verdana, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 16px; color: #222; background: #f3f5f9; }
  .card { background: #fff; border: 1px solid #d6dbe4; border-radius: 8px; padding: 16px 20px; text-align: center; }
  button { margin-top: 12px; padding: 10px 24px; font-size: 16px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="card">
  <h1>Prize Desk</h1>
  <p>Your prize is ready to collect.</p>
  <form method="post" action="/claim">
    <button type="submit" id="claim" disabled>Claim</button>
  </form>
  <p><small>Claiming is closed for maintenance.</small></p>
</div>
</body>
</html>
