<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux Gear - Shop</title>
<style>
  body { font-family: Tahoma, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; color: #222; background: #f6f6f2; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; }
  .price { font-size: 22px; font-weight: bold; }
  button { margin-top: 12px; padding: 8px 16px; }
</style>
</head>
<body>
<h1>Lux Gear</h1>
<div class="card">
  <h2>{{ item.name }}</h2>
  <p>Hand-polished keys. Only one in stock.</p>
  <p class="price">${{ item.price }}</p>
  <form method="post" action="/checkout">
    <input type="hidden" name="item" value="{{ item.id }}">
    <input type="hidden" name="price" value="{{ item.price }}">
    <button type="submit">Buy now</button>
  </form>
</div>
</body>
</html>
